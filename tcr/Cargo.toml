[package]
name = "tcr"
version = "0.1.0"
edition = "2024"
authors = ["Logan-010"]
description = "θchat (thetachat) relay"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
color-eyre = "0.6.5"
libp2p = { version = "0.56.0", features = ["tcp", "noise", "yamux", "websocket", "rendezvous", "macros", "tokio", "relay", "ping", "dns", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
